name: Build Exynos9810 Kernel (Pure Clang 12)

on:
  workflow_dispatch: # Allows manual trigger from the Actions tab

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: LineageOS/android_kernel_samsung_exynos9810
          ref: lineage-20

      - name: Install Build Dependencies & LLVM/Clang 12
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses-dev bison flex libssl-dev git bc wget curl python3 zip zlib1g-dev \
            clang-12 lld-12 llvm-12 binutils-aarch64-linux-gnu

      - name: Compile Kernel with Pure Clang 12
        run: |
          export ARCH=arm64
          export SUBARCH=arm64

          # Generate configuration
          make O=out exynos9810-star2lte_defconfig

          # Compile entirely using Clang 12 and LLVM utilities
          make O=out -j$(nproc) \
            CC=clang-12 \
            LD=ld.lld-12 \
            AR=llvm-ar-12 \
            NM=llvm-nm-12 \
            OBJCOPY=llvm-objcopy-12 \
            OBJDUMP=llvm-objdump-12 \
            STRIP=llvm-strip-12 \
            READELF=llvm-readelf-12 \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu-

      - name: Package with AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git anykernel
          cp out/arch/arm64/boot/Image anykernel/
          cd anykernel
          rm -rf .git README.md
          zip -r9 ../star2lte-LineageKernel-AnyKernel3.zip *

      - name: Upload Flashable ZIP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: star2lte-LineageKernel-AnyKernel3
          path: star2lte-LineageKernel-AnyKernel3.zip
