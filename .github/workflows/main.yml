name: Compile Kernel (Star2lte - GCC 4.9 - GDrive Source)

on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    steps:
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            libncurses5-dev \
            git \
            python3 \
            wget \
            xz-utils \
            rsync \
            unzip

      - name: Download Kernel Source from Google Drive
        run: |
          echo "Downloading kernel source zip from Google Drive..."
          pip install gdown
          
          gdown "https://drive.google.com/uc?id=1WW0mLpZwHvSDrt_VFJF4M1sMiQm2X7hw" -O kernel.zip
          
          echo "Extracting kernel source..."
          unzip -q kernel.zip -d kernel-src

      - name: Setup GCC 4.9 Toolchains
        run: |
          mkdir -p toolchain/aarch64 toolchain/arm32
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 toolchain/aarch64
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 toolchain/arm32

      - name: Build Kernel
        env:
          ARCH: arm64
          SUBARCH: arm64
          CROSS_COMPILE: aarch64-linux-android-
          CROSS_COMPILE_ARM32: arm-linux-androideabi-
        run: |
          export PATH="${{ github.workspace }}/toolchain/aarch64/bin:${{ github.workspace }}/toolchain/arm32/bin:$PATH"
          
          cd kernel-src
          
          echo "=== Listing available defconfigs ==="
          ls -la arch/arm64/configs/
          
          echo "Starting kernel build..."
          mkdir -p out
          
          # If the defconfig name differs, change it here based on the list above
          make O=out exynos9810-star2lte_defconfig
          
          # Set custom localversion
          scripts/config --file out/.config --set-str LOCALVERSION "-iam_devu"
          make O=out olddefconfig
          
          # Compile kernel using all available cores
          make O=out -j$(nproc)

      - name: Archive Kernel Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: star2lte-kernel-gcc49-artifacts
          path: |
            kernel-src/out/arch/arm64/boot/Image
            kernel-src/out/arch/arm64/boot/dts/exynos/*.dtb
            kernel-src/out/arch/arm64/boot/dtbo.img
            kernel-src/out/.config
