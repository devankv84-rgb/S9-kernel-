name: Compile Kernel (Star2lte - GCC 4.9)

on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            libncurses5-dev \
            git \
            python3 \
            wget \
            xz-utils \
            rsync

      - name: Setup GCC 4.9 Toolchains
        run: |
          mkdir -p toolchain/aarch64 toolchain/arm32
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 toolchain/aarch64
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 toolchain/arm32

      - name: Build Kernel
        env:
          ARCH: arm64
          SUBARCH: arm64
          PATH: ${{ github.workspace }}/toolchain/aarch64/bin:${{ github.workspace }}/toolchain/arm32/bin:$PATH
          CROSS_COMPILE: aarch64-linux-android-
          CROSS_COMPILE_ARM32: arm-linux-androideabi-
        run: |
          echo "Starting kernel build for Exynos 9810 (star2lte) using GCC 4.9..."
          mkdir -p out
          
          # Apply the Exynos9810 defconfig
          make O=out Exynos9810-star2lte_defconfig
          
          # Set custom localversion
          scripts/config --file out/.config --set-str LOCALVERSION "-iam_devu"
          make O=out olddefconfig
          
          # Compile kernel using all available cores
          make O=out -j$(nproc)

      - name: Archive Kernel Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: star2lte-kernel-gcc49-artifacts
          path: |
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/dts/exynos/*.dtb
            out/arch/arm64/boot/dtbo.img
            out/.config
