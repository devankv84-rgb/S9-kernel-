name: Compile Samsung OSC Kernel (Star2lte - GCC 4.9)

on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    env:
      ARCH: arm64
      SUBARCH: arm64
      CROSS_COMPILE: aarch64-linux-android-
      CROSS_COMPILE_ARM32: arm-linux-androideabi-
      ANDROID_MAJOR_VERSION: s
    steps:
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            libncurses5-dev \
            git \
            python3 \
            wget \
            xz-utils \
            rsync \
            unzip

      - name: Download Kernel Source from Google Drive
        run: |
          echo "Downloading official Samsung OSC kernel source..."
          pip install gdown
          
          # Replace with your Google Drive file ID if it changed
          gdown "https://drive.google.com/uc?id=1b9fXwpUTxZzOSv2o8A6MuW4_xhVJsP8c" -O kernel.zip
          
          echo "Extracting kernel source..."
          unzip -q kernel.zip -d kernel-src
          
          echo "Fixing file timestamps to prevent clock skew warnings..."
          cd kernel-src
          find . -exec touch {} +

      - name: Setup GCC 4.9 Toolchains
        run: |
          mkdir -p toolchain/aarch64 toolchain/arm32
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 toolchain/aarch64
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 toolchain/arm32

      - name: Build Kernel
        run: |
          # Properly prepend toolchain paths while preserving system binaries like mkdir
          export PATH="${{ github.workspace }}/toolchain/aarch64/bin:${{ github.workspace }}/toolchain/arm32/bin:$PATH"
          
          cd kernel-src
          
          echo "Starting kernel build for Exynos 9810 (star2lte) using official OSC source..."
          mkdir -p out
          
          # Apply the defconfig (adjust name if your OSC source uses a slightly different variant name)
          make O=out HOSTCFLAGS="-fcommon" exynos9810-star2lte_defconfig
          
          # Set custom localversion
          scripts/config --file out/.config --set-str LOCALVERSION "-iam_devu"
          make O=out HOSTCFLAGS="-fcommon" olddefconfig
          
          # Compile kernel using all available cores
          make O=out HOSTCFLAGS="-fcommon" -j$(nproc)

      - name: Archive Kernel Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: star2lte-osc-kernel-artifacts
          path: |
            kernel-src/out/arch/arm64/boot/Image
            kernel-src/out/arch/arm64/boot/dts/exynos/*.dtb
            kernel-src/out/arch/arm64/boot/dtbo.img
            kernel-src/out/.config
