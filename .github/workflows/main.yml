name: Build Exynos9810 Kernel for star2lte

on:
  workflow_dispatch: # Allows manual trigger from the Actions tab

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: LineageOS/android_kernel_samsung_exynos9810
          ref: lineage-20

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses-dev bison flex libssl-dev git bc wget curl python3 zip zlib1g-dev

      - name: Setup Toolchain
        run: |
          # Cloning standard Android GCC/Clang toolchain or a suitable prebuilt toolchain for arm64
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git toolchain/aarch64-linux-android-4.9

      - name: Compile Kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="${{ github.workspace }}/toolchain/aarch64-linux-android-4.9/bin:$PATH"
          export CROSS_COMPILE=aarch64-linux-android-

          # Check your configs directory to confirm exact defconfig name for star2lte
          # E.g., exynos9810-star2lte_defconfig or starlte_defconfig
          make O=out exynos9810-star2lte_defconfig
          make O=out -j$(nproc)

      - name: Package with AnyKernel3
        run: |
          # Clone AnyKernel3
          git clone https://github.com/osm0sis/AnyKernel3.git anykernel
          
          # Copy compiled kernel image
          cp out/arch/arm64/boot/Image anykernel/
          
          # Configure anykernel script for star2lte target
          cd anykernel
          rm -rf .git README.md
          
          # Create zip file
          zip -r9 ../star2lte-LineageKernel-AnyKernel3.zip *

      - name: Upload Flashable ZIP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: star2lte-LineageKernel-AnyKernel3
          path: star2lte-LineageKernel-AnyKernel3.zip
