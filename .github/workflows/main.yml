name: Compile Exynos 9810 Kernel (Official OSR Source - star2lte)

on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    env:
      ARCH: arm64
      SUBARCH: arm64
      CROSS_COMPILE: aarch64-linux-android-
      CROSS_COMPILE_ARM32: arm-linux-androideabi-
      ANDROID_MAJOR_VERSION: q
    steps:
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            libncurses5-dev \
            git \
            python3 \
            wget \
            xz-utils \
            rsync \
            unzip \
            tar \
            file

      - name: Download and Extract Kernel Source Zip
        run: |
          echo "Downloading kernel source zip from release..."
          wget -O kernel-source.zip "https://github.com/devankv84-rgb/S9-kernel-/releases/download/V1/SM-G965F_QQ_Opensource.zip"
          
          echo "Extracting zip archive..."
          mkdir -p temp_extracted
          unzip -q kernel-source.zip -d temp_extracted
          
          echo "Contents of extracted archive:"
          ls -la temp_extracted
          
          # Handle Samsung OSR packaging structure (which often wraps an inner tar/tar.gz or raw folders)
          INNER_ARCHIVE=$(find temp_extracted -name "*.tar.gz" -o -name "*.tar" | head -n 1)
          
          if [ -n "$INNER_ARCHIVE" ]; then
            echo "Found inner archive: $INNER_ARCHIVE. Extracting..."
            tar -xf "$INNER_ARCHIVE" -C .
            SRC_DIR=$(tar -tf "$INNER_ARCHIVE" | head -n 1 | cut -f1 -d"/")
            mv "$SRC_DIR" kernel-src
          else
            # If the zip extracts directly into a source folder
            FIRST_ITEM=$(ls -1 temp_extracted | head -n 1)
            if [ -d "temp_extracted/$FIRST_ITEM" ]; then
              mv "temp_extracted/$FIRST_ITEM" kernel-src
            else
              mv temp_extracted kernel-src
            fi
          fi
          
          echo "Verifying init/uh.elf presence in official source..."
          if [ -f "kernel-src/init/uh.elf" ]; then
            echo "SUCCESS: uh.elf is present in init/ directory."
          else
            echo "WARNING: uh.elf not found in init/ directory. Checking tree..."
            find kernel-src -name "uh.elf"
          fi
          
          echo "Fixing file timestamps to prevent clock skew warnings..."
          cd kernel-src
          find . -exec touch {} +

      - name: Setup GCC 4.9 Toolchains
        run: |
          mkdir -p toolchain/aarch64 toolchain/arm32
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 toolchain/aarch64
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 toolchain/arm32

      - name: Build Kernel
        run: |
          export PATH="${{ github.workspace }}/toolchain/aarch64/bin:${{ github.workspace }}/toolchain/arm32/bin:$PATH"
          
          cd kernel-src
          
          echo "Available defconfigs for Exynos 9810:"
          ls -l arch/arm64/configs/ | grep -iE "star|exynos9810"
          
          echo "Starting kernel build for Exynos 9810 (star2lte)..."
          mkdir -p out
          
          # Dynamically discover the correct star2lte defconfig file name
          DEFCONFIG_NAME=$(ls arch/arm64/configs/ | grep -iE "star2lte|starlte" | head -n 1)
          echo "Using discovered defconfig: $DEFCONFIG_NAME"
          
          # Apply defconfig with HOSTCFLAGS="-fcommon" for host tool compatibility
          make O=out HOSTCFLAGS="-fcommon" "$DEFCONFIG_NAME"
          
          # Set custom localversion suffix to -iam_devu
          scripts/config --file out/.config --set-str LOCALVERSION "-iam_devu"
          make O=out HOSTCFLAGS="-fcommon" olddefconfig
          
          # Compile kernel image and modules
          make O=out HOSTCFLAGS="-fcommon" -j$(nproc)

      - name: Archive Kernel Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: star2lte-osr-kernel-artifacts
          path: |
            kernel-src/out/arch/arm64/boot/Image
            kernel-src/out/arch/arm64/boot/dts/exynos/*.dtb
            kernel-src/out/arch/arm64/boot/dtbo.img
            kernel-src/out/.config
