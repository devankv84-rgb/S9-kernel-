name: Compile Samsung OSC Kernel (Star2lte - GCC 4.9)

on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    env:
      ARCH: arm64
      SUBARCH: arm64
      CROSS_COMPILE: aarch64-linux-android-
      CROSS_COMPILE_ARM32: arm-linux-androideabi-
      ANDROID_MAJOR_VERSION: s
    steps:
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            libncurses5-dev \
            git \
            python3 \
            wget \
            xz-utils \
            rsync \
            unzip \
            tar

      - name: Download and Extract OSC Kernel Source
        run: |
          echo "Downloading official Samsung OSC kernel source..."
          pip install gdown
          gdown "https://drive.google.com/uc?id=1iJExl12AHvnfBxCUqbmWjLYrAoXVKaQw" -O kernel-archive
          
          echo "Preparing source directory..."
          mkdir -p kernel-src kernel-src-raw
          
          # Automatically detect archive type (Zip or Tar)
          if file kernel-archive | grep -q "Zip archive"; then
            unzip -q kernel-archive -d kernel-src-raw
          else
            tar -xf kernel-archive -C kernel-src-raw
          fi
          
          # Flatten nested top-level directory if present in the OSC package
          cd kernel-src-raw
          FIRST_DIR=$(ls -d */ | head -n 1)
          if [ -d "$FIRST_DIR" ]; then
            mv "$FIRST_DIR"/* ../kernel-src/
            mv "$FIRST_DIR"/.[!.]* ../kernel-src/ 2>/dev/null || true
          else
            mv * ../kernel-src/
          fi
          cd ..
          
          echo "Fixing file timestamps to prevent clock skew warnings..."
          cd kernel-src
          find . -exec touch {} +

      - name: Setup GCC 4.9 Toolchains
        run: |
          mkdir -p toolchain/aarch64 toolchain/arm32
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 toolchain/aarch64
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 toolchain/arm32

      - name: Build Kernel
        run: |
          # Properly prepend toolchain paths while preserving system binaries like mkdir
          export PATH="${{ github.workspace }}/toolchain/aarch64/bin:${{ github.workspace }}/toolchain/arm32/bin:$PATH"
          
          cd kernel-src
          
          echo "Available defconfigs for Exynos 9810:"
          ls -l arch/arm64/configs/ | grep -iE "star|exynos9810"
          
          echo "Starting kernel build for Exynos 9810 (star2lte) using Samsung OSC source..."
          mkdir -p out
          
          # Dynamically find the correct star2lte defconfig file name
          DEFCONFIG_NAME=$(ls arch/arm64/configs/ | grep -iE "star2lte|starlte" | head -n 1)
          echo "Using discovered defconfig: $DEFCONFIG_NAME"
          
          # Apply the defconfig with HOSTCFLAGS="-fcommon" for modern host compiler compatibility
          make O=out HOSTCFLAGS="-fcommon" "$DEFCONFIG_NAME"
          
          # Set custom localversion
          scripts/config --file out/.config --set-str LOCALVERSION "-iam_devu"
          make O=out HOSTCFLAGS="-fcommon" olddefconfig
          
          # Compile kernel using all available CPU cores
          make O=out HOSTCFLAGS="-fcommon" -j$(nproc)

      - name: Archive Kernel Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: star2lte-osc-kernel-artifacts
          path: |
            kernel-src/out/arch/arm64/boot/Image
            kernel-src/out/arch/arm64/boot/dts/exynos/*.dtb
            kernel-src/out/arch/arm64/boot/dtbo.img
            kernel-src/out/.config
            
